---
# Codacy repository configuration.
#
# Scope: path-level exclusions only -- Codacy does not support per-pattern
# (rule) overrides in this file; those are managed via the repo's coding
# standard in the Codacy UI/API.
#
# `tests/**` is excluded from bandit, prospector (bundles bandit + pyright),
# opengrep and pylintpython3 because, as of 2026-09-24, those four tools
# accounted for 1,586 of 1,792 open findings on `master`, and 1,505 of those
# were concentrated in `tests/**`:
#   - bandit B101 / prospector_bandit / opengrep assert-used: pytest's
#     idiomatic `assert` (see claude/rules/testing.md), not a real risk.
#   - pylintpython3 W0621 (redefined-outer-name): pytest fixture shadowing,
#     the standard pattern for fixture injection.
#   - prospector's bundled pyright pass over tests/: this repo's own type
#     checking is scoped to `src/` only (`uv run mypy src/`, see CLAUDE.md
#     Quick Commands), so test files were never expected to be type-clean.
# Source code under `src/`, `scripts/` and `.github/` keeps full coverage
# from every enabled tool, including bandit/pylint/opengrep -- only the
# test suite's tool-specific false positives are scoped out.
engines:
  bandit:
    exclude_paths:
      - "tests/**"
  prospector:
    exclude_paths:
      - "tests/**"
  opengrep:
    exclude_paths:
      - "tests/**"
  pylintpython3:
    exclude_paths:
      - "tests/**"
  eslint-8:
    exclude_paths:
      # Valid modern ESM (`export default {...}`) required by commitlint;
      # not part of the shipped exporter. Codacy's eslint-8 engine evaluates
      # it against an ES5 target, so es-x/* rules misfire on it.
      - "commitlint.config.js"

# CHANGELOG.md is generated by semantic-release (@semantic-release/changelog)
# and legitimately repeats section headings ("Bug Fixes", "Features", ...)
# once per release, which markdownlint's MD024 otherwise flags on every run.
exclude_paths:
  - "CHANGELOG.md"
