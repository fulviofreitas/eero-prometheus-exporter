# ============================================================================
# 🧪 Continuous Integration Pipeline
# ============================================================================
# Chain: Commit Lint → Lint & Format → [Type Check ‖ Security ‖ Tests ‖ Docker] → CI Success
#
# All reusable actions are sourced from fulviofreitas/workflow-arsenal/.github/actions/
# ============================================================================

name: 🧪 CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    # Include ready_for_review so CI runs when a draft PR is promoted to
    # ready (opened/synchronize/reopened are the default types — specifying
    # any types here replaces the default, so they all need to be listed).
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # 1️⃣ Commit Lint (Gate 1)
  # ============================================================================
  commitlint:
    name: 📝 Commit Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📝 Validate commits
        uses: fulviofreitas/workflow-arsenal/.github/actions/commitlint@master
        with:
          from-sha: ${{ github.event.pull_request.base.sha }}
          to-sha: ${{ github.event.pull_request.head.sha }}

  # ============================================================================
  # 2️⃣ Lint & Format (Gate 2 - depends on Commit Lint)
  # ============================================================================
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: commitlint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 🐍 Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 🧹 Run Python lint
        uses: fulviofreitas/workflow-arsenal/.github/actions/python-lint@master
        with:
          src-path: "src/"
          tests-path: "tests/"

  # ============================================================================
  # 3️⃣ Type Check (Parallel - depends on Lint)
  # ============================================================================
  type-check:
    name: 🔍 Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 🐍 Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 📚 Install dependencies
        run: uv sync --frozen --extra dev

      - name: 🔎 Run MyPy type checker
        uses: fulviofreitas/workflow-arsenal/.github/actions/python-typecheck@master
        with:
          src-path: "src/eero_exporter/"
          fail-on-error: "true"

  # ============================================================================
  # 3️⃣ Security Scan (Parallel - depends on Lint)
  # ============================================================================
  security:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 🐍 Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: 🛡️ Run security scan
        uses: fulviofreitas/workflow-arsenal/.github/actions/security-semgrep@master
        with:
          config: "p/python p/security-audit"
          target-path: "src/"
          fail-on-findings: "true"

  # ============================================================================
  # 3️⃣ Test Matrix (Parallel - depends on Lint)
  # ============================================================================
  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: 📚 Install dependencies
        run: uv sync --frozen --extra dev

      - name: 🧪 Run tests
        uses: fulviofreitas/workflow-arsenal/.github/actions/python-test@master
        with:
          test-path: "tests/"
          src-path: "src/eero_exporter"
          upload-coverage: ${{ matrix.python-version == '3.12' }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================================
  # 2️⃣b Minimum-SDK Test (Parallel - depends on Lint)
  # ============================================================================
  # uv.lock pins one eero-api version, so the matrix above only ever proves the
  # exporter works against that version -- never against the floor declared in
  # pyproject.toml. An unbounded, untested range is exactly what let eero-api
  # 8.0.0 break every scrape, so the declared floor gets its own run.
  test-min-sdk:
    name: 🧪 Tests (declared eero-api floor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: 🐍 Set up Python
        run: uv python install 3.12

      - name: 📚 Install dependencies at the declared eero-api floor
        run: |
          set -euo pipefail
          FLOOR=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("pyproject.toml").read_text()
          match = re.search(r'"eero-api>=([0-9]+\.[0-9]+\.[0-9]+)', text)
          if not match:
              raise SystemExit("could not find the eero-api lower bound in pyproject.toml")
          print(match.group(1))
          PY
          )
          echo "Testing against the declared floor eero-api==$FLOOR"
          uv sync --frozen --extra dev
          uv pip install "eero-api==$FLOOR"
          # --no-sync everywhere after this point: a plain `uv run` revalidates
          # the lock and would silently restore the locked version, making this
          # job a false guarantee.
          uv run --no-sync python -c "import importlib.metadata as m; v = m.version('eero-api'); print('eero-api', v); raise SystemExit(0 if v == '$FLOOR' else 'expected the declared floor $FLOOR')"

      - name: 🧪 Run tests
        run: uv run --no-sync pytest -q

  # ============================================================================
  # 3️⃣ Docker Build Test (Parallel - depends on Lint)
  # ============================================================================
  docker-build:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 🐳 Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          tags: eero-prometheus-exporter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4️⃣ CI Success Gate (Final - depends on all parallel jobs)
  # ============================================================================
  ci-success:
    name: ✅ CI Success
    runs-on: ubuntu-latest
    needs: [commitlint, lint, type-check, test, test-min-sdk, security, docker-build]
    if: always()

    steps:
      - name: 🔍 Check all jobs passed
        run: |
          COMMITLINT="${{ needs.commitlint.result }}"
          LINT="${{ needs.lint.result }}"
          TYPECHECK="${{ needs.type-check.result }}"
          TEST="${{ needs.test.result }}"
          TESTMIN="${{ needs.test-min-sdk.result }}"
          SECURITY="${{ needs.security.result }}"
          DOCKER="${{ needs.docker-build.result }}"

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🧪 CI Pipeline Summary

          | Stage | Job | Status |
          |:------|:----|:-------|
          | 1️⃣ | 📝 Commit Lint | ${COMMITLINT} |
          | 2️⃣ | 🧹 Lint & Format | ${LINT} |
          | 3️⃣ | 🔍 Type Check | ${TYPECHECK} |
          | 3️⃣ | 🛡️ Security | ${SECURITY} |
          | 3️⃣ | 🧪 Tests | ${TEST} |
          | 3️⃣ | 🧪 Tests (eero-api floor) | ${TESTMIN} |
          | 3️⃣ | 🐳 Docker Build | ${DOCKER} |

          EOF

          # All jobs are required to pass
          if [[ "$COMMITLINT" == "success" && "$LINT" == "success" && "$TYPECHECK" == "success" && "$TEST" == "success" && "$TESTMIN" == "success" && "$SECURITY" == "success" && "$DOCKER" == "success" ]]; then
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          > [!NOTE]
          > ### ✅ All Required Checks Passed
          > CI pipeline completed successfully. Ready for release!

          ---

          ```
          1️⃣ 📝 Commit Lint
                 ↓
          2️⃣ 🧹 Lint & Format
                 ↓
               ┌─┴─┬─────┬─────────┐
          3️⃣   │   │     │         │
          🔍 Type 🛡️ Sec 🧪 Test 🐳 Docker
               └─┬─┴─────┴─────────┘
                 ↓
          4️⃣ ✅ CI Success → 🚀 Release
          ```

          EOF
            exit 0
          else
            cat >> $GITHUB_STEP_SUMMARY << 'EOF'

          > [!CAUTION]
          > ### ❌ Some Required Checks Failed
          > Review the failed jobs above and fix any issues before merging.

          EOF
            exit 1
          fi
