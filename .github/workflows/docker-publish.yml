# ============================================================================
# 🐳 Docker Image Build & Publish
# ============================================================================
# Builds multi-platform Docker images and publishes to GitHub Container Registry.
# Uses reusable workflow from workflow-arsenal for native ARM64 builds.
#
# Gate: the image is only built and pushed when the Release workflow actually
# published a version. Release uploads a `release-published` artifact in that
# case; this workflow looks it up on the triggering run and skips otherwise, so
# `latest` never moves on a merge that did not cut a release.
#
# Chain: CI → Release (artifact when released) → Docker
# ============================================================================

name: 🐳 Docker Build & Publish

on:
  workflow_run:
    workflows: ["🚀 Release"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 🔍 Was a release actually published by the triggering run?
  # ============================================================================
  check-release:
    name: 🔍 Check for published release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      - name: 🔍 Look up release-published artifact
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // The reusable publisher tags every push it makes with `latest`
            // (type=raw,value=latest,enable=${inputs.push} in
            // workflow-arsenal/.github/workflows/docker-build.yml), so ANY run
            // that reaches it moves `latest`. A manual dispatch is therefore
            // only safe from the tag of the newest release: from a branch it
            // would point `latest` at unreleased code, and from an older tag
            // it would silently downgrade every `:latest` user -- across 4.0.0
            // that means handing them a build which cannot read the schema-2
            // session file 4.x writes.
            if (context.eventName === 'workflow_dispatch') {
              const ref = context.ref;
              if (!ref.startsWith('refs/tags/')) {
                core.info(`Manual dispatch from ${ref}, which is not a tag — skipping. `
                  + 'Re-run from the tag of the most recent release to republish its image.');
                core.setOutput('released', 'false');
                return;
              }
              const tag = ref.replace('refs/tags/', '');
              let latest;
              try {
                const res = await github.rest.repos.getLatestRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                });
                latest = res.data.tag_name;
              } catch (err) {
                core.setFailed(`Could not read the latest release to validate ${tag}: ${err.message}`);
                return;
              }
              if (tag !== latest) {
                core.setFailed(`Refusing to publish from ${tag}: the newest release is ${latest}, `
                  + `so this run would move the \`latest\` tag backwards to ${tag}.`);
                return;
              }
              core.info(`Manual dispatch from ${tag}, the newest release — building`);
              core.setOutput('released', 'true');
              return;
            }
            const run = context.payload.workflow_run;
            if (!run || run.conclusion !== 'success') {
              core.info('Triggering Release run did not succeed — skipping');
              core.setOutput('released', 'false');
              return;
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: run.id },
            );
            const found = artifacts.some((a) => a.name === 'release-published');
            core.info(found
              ? 'release-published artifact found — building image'
              : 'No release-published artifact — no version was released, skipping');
            core.setOutput('released', found ? 'true' : 'false');

  # ============================================================================
  # 🐳 Build & publish (gated on a real release)
  # ============================================================================
  docker:
    name: 🐳 Docker
    needs: check-release
    if: needs.check-release.outputs.released == 'true'
    uses: fulviofreitas/workflow-arsenal/.github/workflows/docker-build.yml@master
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      image-name: ghcr.io/${{ github.repository }}
      context: "."
      push: true
      registry: ghcr.io
      registry-username: ${{ github.actor }}
      annotations: |
        org.opencontainers.image.title=eero-prometheus-exporter
        org.opencontainers.image.description=Modern Prometheus exporter for eero mesh WiFi networks
        org.opencontainers.image.url=https://github.com/${{ github.repository }}
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.licenses=MIT
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}
